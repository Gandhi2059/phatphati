name: bid_app
description: "Production Auction and Bidding Application with Server-Enforced Timing, Multi-round State Machine, and Realtime Notifications."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.3.4
  intl: ^0.19.0
  google_fonts: ^6.1.0
  uuid: ^4.3.3
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  file_picker: ^13.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/phatphati_logo.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont.ttf

